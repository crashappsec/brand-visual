# Distribution: git-tag (decided 2026-06-11). Consumers install the tokens via
# github:crashappsec/brand-visual#vX.Y.Z (npm resolves git refs natively), so no
# registry publish happens here. The spec's npm path stays available as a later
# add-on: restore a "Publish" step with an NPM_TOKEN secret and consumers can
# switch to npm i @crashoverride/brand-tokens with no change to this repo.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - name: Tag matches package + plugin versions
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version-sync.mjs "$TAG"
      - name: Package contents are publishable (dry run)
        run: npm pack --dry-run
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes
